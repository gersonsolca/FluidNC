name: SpiderMic
board: None
uart1:
  txd_pin: gpio.22
  rxd_pin: gpio.21
  baud: 115200
  mode: 8N1
#kinematics:
#  spider_mic:
#    R_b: 6.0
#    max_x: 372.0
#    max_y: 372.0
#    _kinematic_segment_len_mm: 1.0
#    _softLimits: false
axes:
  x:
    steps_per_mm: 80
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 25
    max_travel_mm: 1000
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        step_pin: gpio.27:pu
        direction_pin: gpio.26
        uart_num: 1
        addr: 0
        stallguard_debug: true
        run_mode: Stallguard
        homing_mode: Stallguard
        use_enable: true
        stallguard: 15
#        cs_pin: NO_PIN
#        r_sense_ohms: 0.110
#        run_amps: 1.000
#        hold_amps: 0.500
#        microsteps: 16
#        stallguard: 0
#        stallguard_debug: false
#        toff_disable: 0
#        toff_stealthchop: 5
#        toff_coolstep: 3
#        homing_mode: StealthChop
#        homing_amps: 0.50
#        disable_pin: NO_PIN
  y:
    steps_per_mm: 80
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 25
    max_travel_mm: 1000
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        step_pin: gpio.33:pu
        direction_pin: gpio.32:low
        uart_num: 1
        addr: 1
        stallguard_debug: true
        run_mode: Stallguard
        homing_mode: Stallguard
        use_enable: true
        stallguard: 15
  z:
    steps_per_mm: 80
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 25
    max_travel_mm: 1000
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        step_pin: gpio.14:pu
        direction_pin: gpio.12:low
        uart_num: 1
        addr: 2
        stallguard_debug: true
        run_mode: Stallguard
        homing_mode: Stallguard
        use_enable: true
        stallguard: 15
  a:
    steps_per_mm: 80
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 25
    max_travel_mm: 1000
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        step_pin: gpio.16:pu
        direction_pin: gpio.17
        uart_num: 1
        addr: 3
        run_mode: Stallguard
        homing_mode: Stallguard
        use_enable: true
        stallguard_debug: true
        stallguard: 15
stepping:
  engine: RMT
  idle_ms: 250
  pulse_us: 4
  dir_delay_us: 0
  disable_delay_us: 0
spi:
  miso_pin: gpio.19:pd
  mosi_pin: gpio.23:pd
  sck_pin: gpio.18:pd
