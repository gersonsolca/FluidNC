name: SpiderMic
board: Fysect E4

#spi:
#  miso_pin: gpio.19
#  mosi_pin: gpio.23
#  sck_pin: gpio.18

#sdcard:
#  cs_pin: gpio.5
#  card_detect_pin: NO_PIN

macros:
  startup_line0:
  startup_line1:
  macro0: 
  macro1:
  macro2:
  macro3:

uart1:
  txd_pin: gpio.22
  rxd_pin: gpio.21
  baud: 115200
  mode: 8N1

stepping:
  engine: RMT
  idle_ms: 250
  pulse_us: 4
  dir_delay_us: 0
  disable_delay_us: 0

kinematics:
  SpiderMic:
    R_b_mm: 6
    kinematic_segment_len_mm: 1.0
    softLimits: false
    # limits ingnored if softLimits is false
    x_min_mm: 0
    x_max_mm: 370
    y_min_mm: 0
    y_max_mm: 370

axes:
  shared_stepper_disable_pin: gpio.25
  homing_runs: 2
  x:
    steps_per_mm: 85
    # 200 * 16 / (6 * 2π) = 800 / (3 * π)
    max_rate_mm_per_min: 12000
    acceleration_mm_per_sec2: 150
    max_travel_mm: 526
    # sqrt(pow(_max_x, 2) + pow(_max_y, 2))
    soft_limits: false
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: gpio.34
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 2
      tmc_2209:
        step_pin: gpio.27:pu
        direction_pin: gpio.26
        uart_num: 1
        addr: 1
        stallguard_debug: true
        run_mode: SpreadCycle
        # run_mode: StealthChop run_amps: 0.500
        homing_mode: Stallguard
        use_enable: false
        stallguard: 31
        hold_amps: 0.5
        r_sense_ohms: 0.15
    homing:
      cycle: 1
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 650
      seek_mm_per_min: 650
      settle_ms: 1000
      seek_scaler: 1.1
      feed_scaler: 1.1
  y:
    steps_per_mm: 85
    max_rate_mm_per_min: 12000
    acceleration_mm_per_sec2: 150
    max_travel_mm: 526
    soft_limits: false
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: gpio.35
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 2
      tmc_2209:
        step_pin: gpio.33:pu
        direction_pin: gpio.32:low
        uart_num: 1
        addr: 3
        stallguard_debug: true
        run_mode: SpreadCycle
        homing_mode: Stallguard
        use_enable: false
        stallguard: 31
        r_sense_ohms: 0.15
    homing:
      cycle: 1
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 650
      seek_mm_per_min: 650
      settle_ms: 1000
      seek_scaler: 1.1
      feed_scaler: 1.1
  z:
    steps_per_mm: 85
    max_rate_mm_per_min: 12000
    acceleration_mm_per_sec2: 150
    max_travel_mm: 526
    soft_limits: false
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: gpio.23
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 2
      tmc_2209:
        step_pin: gpio.14:pu
        direction_pin: gpio.12:low
        uart_num: 1
        addr: 0
        stallguard_debug: true
        run_mode: SpreadCycle
        homing_mode: Stallguard
        use_enable: false
        stallguard: 31
        r_sense_ohms: 0.15
    homing:
      cycle: 1
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 650
      seek_mm_per_min: 650
      settle_ms: 1000
      seek_scaler: 1.1
      feed_scaler: 1.1
  a:
    steps_per_mm: 85
    max_rate_mm_per_min: 12000
    acceleration_mm_per_sec2: 150
    max_travel_mm: 526
    soft_limits: false
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        step_pin: gpio.16:pu
        direction_pin: gpio.17
        uart_num: 1
        addr: 2
        run_mode: SpreadCycle
        homing_mode: Stallguard
        use_enable: false
        stallguard_debug: true
        stallguard: 31
        r_sense_ohms: 0.15
    homing:
      cycle: 1
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 650
      seek_mm_per_min: 650
      settle_ms: 1000
      seek_scaler: 1.1
      feed_scaler: 1.1
